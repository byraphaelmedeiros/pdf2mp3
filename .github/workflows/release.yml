name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Require final version, dated changelog and source integrated into main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_check.py --tag "$RELEASE_TAG" --main-ref origin/main

  quality:
    needs: version
    uses: ./.github/workflows/quality.yml

  publish:
    needs: [version, quality]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-evidence
          path: evidence
      - name: Verify and select the tested artifacts without rebuilding
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('evidence')
          summaries = list(root.rglob('summary.json'))
          assert len(summaries) == 1, 'Expected one release gate report'
          report = summaries[0]
          data = json.loads(report.read_text())
          import os
          assert data['status'] == 'PASS' and data['profile'] == 'release'
          assert data['commit'] == os.environ['GITHUB_SHA']
          hashes = json.loads(report.with_name('artifacts.json').read_text())
          assert len(hashes) == 2
          destination = pathlib.Path('dist')
          destination.mkdir()
          for name, expected in hashes.items():
              source = report.parent / 'dist' / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
              shutil.copy2(source, destination / name)
          PY
      - name: Publish tested wheel and sdist
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
