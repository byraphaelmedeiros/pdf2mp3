name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Verify FFmpeg before running the gate
        run: ffmpeg -version
      - name: Verify ffprobe before running the gate
        run: ffprobe -version
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run release profile against the published baseline
        run: python scripts/quality.py release --base v1.0.0
      - name: Preserve gate evidence and tested distributions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            .quality/runs/*/*.json
            .quality/runs/*/*.log
            .quality/runs/*/*.txt
            .quality/runs/*/dist/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Download the evidence to verify artifact compatibility
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/quality-readback
      - name: Verify downloaded source identity and distribution hashes
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/quality-readback
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          reports = list(pathlib.Path(os.environ['EVIDENCE_PATH']).rglob('summary.json'))
          assert len(reports) == 1, 'Expected one quality report'
          report = reports[0]
          data = json.loads(report.read_text())
          assert data['status'] == 'PASS' and data['commit'] == os.environ['GITHUB_SHA']
          hashes = json.loads(report.with_name('artifacts.json').read_text())
          assert len(hashes) == 2
          for name, expected in hashes.items():
              assert hashlib.sha256((report.parent / 'dist' / name).read_bytes()).hexdigest() == expected
          PY

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        name: Install audio tools with bounded retries
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -eq 0 -and
                (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
                (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
              break
            }
            if ($attempt -eq 3) { throw "FFmpeg installation failed after three attempts" }
            Start-Sleep -Seconds 10
          }
      - name: Verify FFmpeg before running tests
        run: ffmpeg -version
      - name: Verify ffprobe before running tests
        run: ffprobe -version
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build and smoke installed wheel and sdist
        run: python scripts/package_check.py .quality/compatibility
