version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-development:
        patterns:
          - pip
          - pytest
          - pytest-*
          - reportlab
          - hypothesis
          - coverage
          - ruff
          - mypy
          - bandit
          - detect-secrets
          - pip-audit
          - pip-licenses
          - mutmut
          - build
          - twine
      python-runtime:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
